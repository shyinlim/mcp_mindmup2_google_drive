version: '3.8'

services:
  mcp_mindmup:
    image: mcp_mindmup:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: mcp_mindmup_container
    environment:
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
    ports:
      - '9802:9802'
    volumes:
      - ..:/app
    command: ['python3','run.py']
    # Note: Google Drive credential is now provided per-request via X-Google-Credential header.
    # Each user sets their base64 encoded service account JSON in mcp.json headers.